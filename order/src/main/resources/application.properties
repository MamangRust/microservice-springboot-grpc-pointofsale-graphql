spring.application.name=order-service
spring.datasource.url=jdbc:postgresql://${ORDER_DB_HOST:172.17.0.2}:${ORDER_DB_PORT:5432}/${ORDER_DB_NAME:example_jpa_pointofsale}
spring.datasource.username=${ORDER_DB_USER:postgress}
spring.datasource.password=${ORDER_DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9001

# gRPC client -> merchant service
grpc.client.merchant.host=${MERCHANT_SERVICE_HOST:localhost}
grpc.client.merchant.port=${MERCHANT_SERVICE_PORT:9005}

# gRPC client -> cashier service
grpc.client.cashier.host=${CASHIER_SERVICE_HOST:localhost}
grpc.client.cashier.port=${CASHIER_SERVICE_PORT:9014}

# gRPC client -> product service
grpc.client.product.host=${PRODUCT_SERVICE_HOST:localhost}
grpc.client.product.port=${PRODUCT_SERVICE_PORT:9003}

# gRPC client -> order-item service
grpc.client.order-item.host=${ORDER_ITEM_SERVICE_HOST:localhost}
grpc.client.order-item.port=${ORDER_ITEM_SERVICE_PORT:9016}

# ---- Kafka (transactional outbox relay) ----
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
kafka.acks=${KAFKA_ACKS:all}
kafka.enable.idempotence=${KAFKA_ENABLE_IDEMPOTENCE:true}
kafka.retries=${KAFKA_RETRIES:10}
kafka.retry.backoff.ms=${KAFKA_RETRY_BACKOFF_MS:500}
kafka.max.in.flight.requests.per.connection=${KAFKA_MAX_IN_FLIGHT:5}
kafka.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:120000}
kafka.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:30000}
kafka.compression.type=${KAFKA_COMPRESSION_TYPE:lz4}
kafka.linger.ms=${KAFKA_LINGER_MS:5}
kafka.batch.size=${KAFKA_BATCH_SIZE:16384}
kafka.max.block.ms=${KAFKA_MAX_BLOCK_MS:60000}

# Outbox relay tuning. The order service owns the ORDER and ORDER_ITEM domains;
# the other domains in the shared outbox table belong to other services.
outbox.publisher.interval-ms=${OUTBOX_PUBLISHER_INTERVAL_MS:5000}
outbox.publisher.initial-delay-ms=${OUTBOX_PUBLISHER_INITIAL_DELAY_MS:5000}
outbox.publisher.batch-size=${OUTBOX_PUBLISHER_BATCH_SIZE:50}
outbox.publisher.max-attempts=${OUTBOX_PUBLISHER_MAX_ATTEMPTS:5}
outbox.publisher.lease-seconds=${OUTBOX_PUBLISHER_LEASE_SECONDS:300}
outbox.publisher.domains=${OUTBOX_PUBLISHER_DOMAINS:ORDER,ORDER_ITEM}
