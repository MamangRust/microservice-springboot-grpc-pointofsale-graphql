spring.application.name=user-service
spring.datasource.url=jdbc:postgresql://${USER_DB_HOST:172.17.0.2}:${USER_DB_PORT:5432}/${USER_DB_NAME:example_jpa_pointofsale}
spring.datasource.username=${USER_DB_USER:postgress}
spring.datasource.password=${USER_DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9011

# gRPC client -> role service
grpc.client.role.host=${ROLE_SERVICE_HOST:localhost}
grpc.client.role.port=${ROLE_SERVICE_PORT:9006}
