spring.application.name=category-service
spring.datasource.url=jdbc:postgresql://${CATEGORY_DB_HOST:172.17.0.2}:${CATEGORY_DB_PORT:5432}/${CATEGORY_DB_NAME:example_jpa_pointofsale}
spring.datasource.username=${CATEGORY_DB_USER:postgress}
spring.datasource.password=${CATEGORY_DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9015
