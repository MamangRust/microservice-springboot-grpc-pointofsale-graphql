spring.application.name=cashier-service
spring.datasource.url=jdbc:postgresql://${CASHIER_DB_HOST:172.17.0.2}:${CASHIER_DB_PORT:5432}/${CASHIER_DB_NAME:example_jpa_pointofsale}
spring.datasource.username=${CASHIER_DB_USER:postgress}
spring.datasource.password=${CASHIER_DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9014

# gRPC client -> merchant service
grpc.client.merchant.host=${MERCHANT_SERVICE_HOST:localhost}
grpc.client.merchant.port=${MERCHANT_SERVICE_PORT:9005}

# gRPC client -> user service
grpc.client.user.host=${USER_SERVICE_HOST:localhost}
grpc.client.user.port=${USER_SERVICE_PORT:9011}
