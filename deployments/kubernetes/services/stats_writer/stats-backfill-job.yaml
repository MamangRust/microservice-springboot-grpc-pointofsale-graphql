apiVersion: batch/v1
kind: Job
metadata:
  name: stats-backfill
  namespace: point-of-sale
spec:
  # Manual job: apply it explicitly when historical OLTP rows need to be
  # materialized into ClickHouse. Re-running is safe — event ids are
  # deterministic per source row, so ClickHouse ReplacingMergeTree dedups.
  backoffLimit: 3
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-deps
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for source PostgreSQL (sales) + ClickHouse..."
              # The backfill reads aggregated revenue directly from the per-context
              # sales DB (JDBC), not the gRPC services, so wait on those.
              until nc -z postgres-sales.point-of-sale.svc.cluster.local 5432 \
                && nc -z clickhouse.point-of-sale.svc.cluster.local 9000; do
                echo "Dependencies not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] All dependencies are ready!"
      containers:
        - name: stats-backfill
          image: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/stats_writer:latest
          imagePullPolicy: IfNotPresent
          args: ["backfill"]
          env:
            # Run the embedded one-shot backfill (CommandLineRunner) instead of the
            # Kafka consumer; the app also disables the web stack in this mode.
            - name: APP_BACKFILL_ENABLED
              value: "true"
            # Point the source DataSource at the in-cluster sales PostgreSQL.
            - name: backfill.source.url
              value: "jdbc:postgresql://postgres-sales.point-of-sale.svc.cluster.local:5432/pos_sales"
            - name: backfill.source.user
              value: "DRAGON"
            - name: backfill.source.password
              value: "DRAGON"
            # Schema-correct backfill query: real transactions table has
            # (merchant_id, amount, created_at); product_id is not a column, so it
            # is fixed to 0 to stay consistent with the live stats.*.event producer.
            - name: BACKFILL_SQL
              value: "SELECT to_char(created_at, 'YYYY-MM') AS period, COALESCE(merchant_id, 0) AS merchant_id, 0 AS product_id, SUM(amount) AS revenue FROM transactions GROUP BY 1, 2"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
      volumes:
        - name: app-logs
          persistentVolumeClaim:
            claimName: app-logs-pvc
      restartPolicy: OnFailure
