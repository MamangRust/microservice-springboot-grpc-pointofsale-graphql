spring.application.name=product-service
spring.datasource.url=jdbc:postgresql://${PRODUCT_DB_HOST:172.17.0.2}:${PRODUCT_DB_PORT:5432}/${PRODUCT_DB_NAME:example_jpa_pointofsale}
spring.datasource.username=${PRODUCT_DB_USER:postgress}
spring.datasource.password=${PRODUCT_DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9003

# gRPC client -> merchant service
grpc.client.merchant.host=${MERCHANT_SERVICE_HOST:localhost}
grpc.client.merchant.port=${MERCHANT_SERVICE_PORT:9005}

# gRPC client -> category service
grpc.client.category.host=${CATEGORY_SERVICE_HOST:localhost}
grpc.client.category.port=${CATEGORY_SERVICE_PORT:9015}
