spring.datasource.generate-unique-name=true
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,MONTH,DAY;INIT=RUNSCRIPT FROM 'classpath:init.sql'
spring.sql.init.mode=never
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.boot.testcontainers.enabled=false

# bind an ephemeral gRPC port during tests
grpc.server.port=0

# do not run the cross-service DatabaseSeeder during tests
app.seed.enabled=false

# JWT (required by common JwtProvider)
springjwt.app.jwtSecret=${JWT_SECRET:0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31}
springjwt.app.jwtRefreshSecret=${JWT_REFRESH_SECRET:0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32}
springjwt.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
springjwt.app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:86400000}
