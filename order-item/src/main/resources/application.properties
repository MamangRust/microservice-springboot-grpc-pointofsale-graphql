spring.application.name=order-item-service
spring.datasource.url=jdbc:postgresql://${ORDER_ITEM_DB_HOST:172.17.0.2}:${ORDER_ITEM_DB_PORT:5432}/${ORDER_ITEM_DB_NAME:example_jpa_pointofsale}
spring.datasource.username=${ORDER_ITEM_DB_USER:postgress}
spring.datasource.password=${ORDER_ITEM_DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9016
