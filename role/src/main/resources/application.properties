spring.application.name=role-service
spring.datasource.url=jdbc:postgresql://${ROLE_DB_HOST:172.17.0.2}:${ROLE_DB_PORT:5432}/${ROLE_DB_NAME:example_jpa_pointofsale}
spring.datasource.username=${ROLE_DB_USER:postgress}
spring.datasource.password=${ROLE_DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9006
